name: Publish api-gateway

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "crates/api-gateway/src/**"
      - "crates/api-gateway/Cargo.toml"
      - "crates/api-gateway/Cargo.lock"
      - "crates/api-gateway/Dockerfile"
      - "crates/common/src/**"
      - "crates/common/Cargo.toml"
      - "crates/common/Cargo.lock"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sproj/api-gateway

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build and push
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: crates/api-gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
