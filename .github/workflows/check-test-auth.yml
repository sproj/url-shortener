name: Check & Test auth

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "crates/auth/**"
      - "crates/common/**"

env:
  CARGO_TERM_COLOR: always
  ENV_TEST: 1
  TESTCONTAINERS_RYUK_DISABLED: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: cargo-auth-lint
      - name: check
        run: cargo check -p auth
      - name: clippy
        run: cargo clippy -p auth -- -D warnings
      - name: fmt
        run: cargo fmt --check

  unit-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: cargo-auth-unit-test
      - name: unit test
        run: cargo test -p auth --lib

  integration-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: cargo-auth-integration-test
      - name: integration test
        run: cargo test -p auth --tests
