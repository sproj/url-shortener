name: Check & Test analytics-consumer

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "crates/analytics-consumer/**"
      - "crates/common/**"

env:
  CARGO_TERM_COLOR: always
  ENV_TEST: 1
  TESTCONTAINERS_RYUK_DISABLED: true
  # api
  SERVICE_HOST: 127.0.0.1
  SERVICE_PORT: 8081
  # pgres
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: 5432
  POSTGRES_DB: analytics
  POSTGRES_CONNECTION_POOL: 5

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: cargo-analytics-consumer-lint
      - name: check
        run: cargo check -p analytics-consumer
      - name: clippy
        run: cargo clippy -p analytics-consumer -- -D warnings
      - name: fmt
        run: cargo fmt --check

  unit-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: cargo-analytics-consumer-unit-test
      - name: unit test
        run: cargo test -p analytics-consumer --lib

  integration-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: cargo-analytics-consumer-integration-test
      - name: integration test
        run: cargo test -p analytics-consumer --tests
