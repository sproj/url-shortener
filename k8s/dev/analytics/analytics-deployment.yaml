apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-consumer
  namespace: url-shortener
  labels:
    app: analytics
    component: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
      component: consumer
  template:
    metadata:
      labels:
        app: analytics
        component: consumer
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      initContainers:
        - name: create-database
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: analytics-consumer-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-consumer-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: analytics-consumer-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: analytics-consumer-config
                  key: POSTGRES_PORT
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: analytics-consumer-secrets
                  key: rabbitmq-username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: url-shortener-secrets
                  key: rabbitmq-password
          command:
            - sh
            - -c
            - |
              CONN="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/postgres"
              psql "$CONN" -tc "SELECT 1 FROM pg_database WHERE datname='analytics'" \
                | grep -q 1 \
                || psql "$CONN" -c "CREATE DATABASE analytics"
      containers:
        - name: analytics
          image: ghcr.io/sproj/analytics:main
          imagePullPolicy: Always

          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: analytics-consumer-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: url-shortener-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: url-shortener-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "analytics"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: password
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
