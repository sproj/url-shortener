# ClusterIP service — rabbitmq is internal only
# App connects to: rabbitmq-service:5672                                                                                                                                                     
# Management UI accessible via: kubectl port-forward svc/rabbitmq-service 15672:15672 -n url-shortener
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: url-shortener
spec:
  selector:
    app: url-shortener
    component: rabbitmq
  ports:
    - port: 5672
      targetPort: 5672
    - port: 15672
      targetPort: 15672
      name: management
