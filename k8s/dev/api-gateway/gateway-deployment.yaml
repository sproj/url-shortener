apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: api-gateway
  labels:
    app: api-gateway
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
      component: api
  template:
    metadata:
      labels:
        app: api-gateway
        component: api
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      initContainers:
        - name: create-database
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-gateway-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: api-gateway-config
                  key: POSTGRES_PORT
          command:
            - sh
            - -c
            - |
              CONN="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/postgres"
              psql "$CONN" -tc "SELECT 1 FROM pg_database WHERE datname='api_gateway'" \
                | grep -q 1 \
                || psql "$CONN" -c "CREATE DATABASE api_gateway"
      containers:
        - name: api-gateway
          image: ghcr.io/sproj/api-gateway@sha256:d6690f2023d0a938002038831f16d3ccb03925254b52323fbfeaf0ae8acd4e92
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - configMapRef:
                name: api-gateway-routing-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
